name: quan_ly_sinh_vien_app
description: Ứng dụng mobile Hệ thống quản lý sinh viên tích hợp nhận diện khuôn mặt.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  camera: ^0.11.0+2
  camera_web: ^0.3.5+6
  image: ^4.5.4
  mobile_scanner: ^7.1.0
  qr_flutter: ^4.1.0
  google_mlkit_face_detection: ^0.13.1
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^18.0.1
  intl: ^0.20.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
