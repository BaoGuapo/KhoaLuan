name: quan_ly_sinh_vien_app
description: Ứng dụng mobile Hệ thống quản lý sinh viên tích hợp nhận diện khuôn mặt.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^9.2.0
  http: ^1.6.0
  camera: ^0.11.0
  google_mlkit_face_detection: ^0.12.0
  google_mlkit_commons: ^0.9.0
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  firebase_crashlytics: ^4.0.0
  firebase_analytics: ^11.0.0
  flutter_local_notifications: ^18.0.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  permission_handler: ^11.0.0
  url_launcher: ^6.2.0
  intl: ^0.19.0
  local_auth: ^2.3.0
  riverpod: ^2.5.0
  sqflite: ^2.3.0
  drift: ^2.18.0
  tflite_flutter: ^0.10.0
  pdf: ^3.11.0
  printing: ^5.13.0
  open_filex: ^4.4.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/face_embedding.tflite